<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rais Global | Premium Essentials</title>
    <style>
        html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#bgImage {

    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: -1;
    background: #0B1C18;
}

.content {
    position: relative;
    z-index: 1;
    text-align: center;
    padding-top: 100px;
}

        /* Large touch-friendly button */
        .btn {
            display: block;
            width: fit-content;
            margin: 0 auto;
            padding: 18px 40px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 3px;
            color: var(--bg-green);
            background: #EFD6A8;
            border-radius: 2px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            transition: 0.3s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <img src="background_1.webp" id="bgImage">
    <div class="content">
        <a href="http://raisglobal.com/products.html" class="btn">View Our Products</a>
    </div>
</body>
</html>
